<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kép Galéria Lightbox-szal</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 0;
        }

        #container_1 {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin: 20px auto;
            max-width: 1000px;
        }

        .imgStyle {
            width: 100%;
            max-width: 120px;
            height: auto;
            border: 3px solid brown;
            cursor: pointer;
            transition: border-color 0.2s ease;
        }

        .imgStyle:hover {
            border-color: black;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 100;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: rgba(0, 0, 0, 0.85);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            width: 90vw;
            max-width: 800px;
            height: auto;
            max-height: 80vh;
            object-fit: contain;
            border: 4px solid white;
            box-shadow: 0 0 10px black;
        }

        .close,
        .prev,
        .next {
            position: absolute;
            color: white;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 50%;
        }

        .close {
            top: 20px;
            right: 30px;
            transform: none;
        }

        .prev {
            top: 50%;
            left: 30px;
            transform: translateY(-50%);
        }

        .next {
            top: 50%;
            right: 30px;
            transform: translateY(-50%);
        }

        @media (max-width: 600px) {
            .close,
            .prev,
            .next {
                font-size: 28px;
                padding: 6px;
            }

            .close {
                top: 15px;
                right: 20px;
            }

            .prev {
                left: 15px;
            }

            .next {
                right: 15px;
            }
        }
    </style>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>

<body>

    <div id="container_1">
        <img src="img/mountains.jpg" class="imgStyle" alt="mountains">
        <img src="img/santiago_de_chile.jpg" class="imgStyle" alt="santiago_de_chile">
        <img src="img/desert.jpg" class="imgStyle" alt="desert">
        <img src="img/countryside.jpg" class="imgStyle" alt="countryside">
        <img src="img/valparaiso.jpg" class="imgStyle" alt="valparaiso">
    </div>

    <div id="myModal" class="modal">
        <span class="close">&times;</span>
        <span class="prev">&#10094;</span>
        <img class="modal-content" id="modalImage">
        <span class="next">&#10095;</span>
    </div>

    <script>
        $(document).ready(function () {
            const $modal = $('#myModal');
            const $modalImg = $('#modalImage');
            const $galleryImages = $('#container_1 img');
            let currentIndex = 0;

            function showModal(index) {
                const src = $galleryImages.eq(index).attr('src');
                $modalImg.attr('src', src);
                $modal.fadeIn(200);
                currentIndex = index;
            }

            function closeModal() {
                $modal.fadeOut(200);
            }

            function showNext() {
                currentIndex = (currentIndex + 1) % $galleryImages.length;
                showModal(currentIndex);
            }

            function showPrev() {
                currentIndex = (currentIndex - 1 + $galleryImages.length) % $galleryImages.length;
                showModal(currentIndex);
            }

            $galleryImages.click(function () {
                const index = $galleryImages.index(this);
                showModal(index);
            });

            $('.close').click(closeModal);
            $('.next').click(function (e) {
                e.stopPropagation();
                showNext();
            });
            $('.prev').click(function (e) {
                e.stopPropagation();
                showPrev();
            });

            $(document).on('keydown', function (e) {
                if (e.key === "Escape") {
                    closeModal();
                } else if (e.key === "ArrowRight") {
                    showNext();
                } else if (e.key === "ArrowLeft") {
                    showPrev();
                }
            });

            $modal.click(function (e) {
                if (!$(e.target).is('#modalImage')) {
                    closeModal();
                }
            });
        });
    </script>

</body>

</html>
